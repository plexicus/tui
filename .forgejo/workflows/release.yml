# Tag-triggered release on scm.plexicus.ai: build the single-file binaries (macOS arm64/x64,
# Linux x64), publish them as a Forgejo release, then (when the GH_RELEASE_TOKEN repo secret is set (Forgejo rejects secret names starting with GITHUB_))
# push the same artifacts to the GitHub mirror's release page.
# workflow_dispatch = dry run: builds and checksums, publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: [docker, ubuntu-latest, light]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version ($want)"; exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build binaries and checksums
        run: scripts/build-release.sh dist
      - name: Publish Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-release.sh forgejo "$GITHUB_REF_NAME" dist
      - name: Publish GitHub release (mirror)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: scripts/publish-release.sh github "$GITHUB_REF_NAME" dist
